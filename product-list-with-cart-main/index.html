<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">

  <title>Frontend Mentor | Product list with cart</title>

 
</head>

<body>

  <main>
    <div class="left">
      <div class="card">
        <div class="image">
          <img src="assets/images/image-waffle-desktop.jpg" />
        </div>
        <div class="text">
          <div class="interactions">
            <button  class="hidden">
              <img src="assets/images/icon-add-to-cart.svg" />
              Add to Cart
            </button>
            <div>
              <button><img src="assets/images/icon-increment-quantity.svg"></button>
              <p>4</p>
              <button><img src="assets/images/icon-decrement-quantity.svg"></button>
            </div>
          </div>
          <p class="item">Waffle</p>
          <p class="item-title"> Waffle with Berries</p>
          <p class="item-price">$6.50</p>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="cart-panel">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <p class="cart-summary">Items in cart: <span class="cart-count">0</span></p>
        </div>
        <div class="cart-items">
          <div class="cart-empty">Your added items will appear here</div>
        </div>
        <div class="cart-total">
          <span>Total</span>
          <strong>$<span class="cart-total-value">0.00</span></strong>
        </div>
        <button type="button" class="cart-confirm-btn" disabled>Confirm Order</button>
        <div class="cart-message"></div>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">MARTHA</a>.
  </footer>
  <script src="index.js"></script>
</body>

</html>
